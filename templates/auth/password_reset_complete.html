{% extends 'base.html' %}
{% load i18n %}
{% block page_title %}{% trans "Password updated" %} - {{ brand_name }}{% endblock %}

{% block content %}
<section class="auth-wrapper">
    <div class="auth-card text-center">
        <div class="auth-logo"><svg aria-hidden="true"><use href="#i-check"/></svg></div>
        <h1>{% trans "Password updated" %}</h1>
        <p class="muted mt-2">{% trans "Your account is secure. Log in with your new password to continue." %}</p>
        <a class="btn btn-primary btn-lg mt-4" href="{% url 'login' %}">{% trans "Log in" %} <svg class="icon" aria-hidden="true"><use href="#i-arrow"/></svg></a>
    </div>
</section>
{% endblock %}
