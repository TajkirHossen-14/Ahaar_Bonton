{% extends 'base.html' %}
{% block title %}Password Reset Complete{% endblock %}
{% block content %}
<section class="auth-wrapper">
    <div class="card auth-card" style="text-align:center;">
        <div style="font-size:3rem; margin-bottom:1rem;">&#9989;</div>
        <h2 style="color:var(--green-700);">Password Reset Complete!</h2>
        <p style="color:var(--muted);">
            Your password has been successfully
            updated. You can now log in with your new password.
        </p>

        <a class="btn btn-primary btn-lg" style="margin-top:0.85rem;" href="{% url 'login' %}">Login Now</a>

        <p class="auth-footer">
            Need help?
            Contact us at support@ahaarbonton.com
        </p>
    </div>
</section>
{% endblock %}
